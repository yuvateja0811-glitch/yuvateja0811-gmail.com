<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="gradBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="capGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>

  <!-- Background circle with safe-zone margin -->
  <rect width="512" height="512" rx="112" fill="url(#gradBg)"/>

  <!-- Outer Ring Shield -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="rgba(56, 189, 248, 0.25)" stroke-width="4"/>
  <circle cx="256" cy="256" r="195" fill="none" stroke="rgba(56, 189, 248, 0.5)" stroke-width="2" stroke-dasharray="8 6"/>

  <!-- Academic Graduation Cap -->
  <path d="M256 128 L390 196 L256 264 L122 196 Z" fill="url(#capGrad)"/>
  <path d="M176 223 L176 295 C176 338 256 360 256 360 C256 360 336 338 336 295 L336 223 L256 264 Z" fill="url(#capGrad)" opacity="0.9"/>

  <!-- Tassel -->
  <path d="M362 208 L374 276 L368 280 L362 208 Z" fill="url(#goldGrad)"/>
  <circle cx="371" cy="284" r="8" fill="url(#goldGrad)"/>

  <!-- Monogram text -->
  <text x="256" y="420" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="44" fill="#ffffff" text-anchor="middle" letter-spacing="3">
    GVP CSE-2
  </text>
  <text x="256" y="452" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="20" fill="#38bdf8" text-anchor="middle" letter-spacing="1">
    ACADEMIC PORTAL
  </text>
</svg>
